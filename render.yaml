services:
  - type: web
    name: content-desk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Supabase "content-desk" project -> Settings -> Database -> Connection string
      - key: DATABASE_URL
        sync: false
      # Replit's own AI Integrations gateway -> point these at your own
      # OpenAI-compatible endpoint/key instead (see README)
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      # Media library uploads -> Supabase Storage (see README "Media storage").
      # The anon key is not a secret (it's meant to be public; the bucket's
      # RLS policies are what actually gate access) so it's safe to check in.
      - key: SUPABASE_URL
        value: https://qpoqotxaktzhytdkyeeh.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwb3FvdHhha3R6aHl0ZGt5ZWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTc3MzEsImV4cCI6MjEwNDk3MzczMX0.xonu887TEOKpbkVsQsK4WOYPIEWdX6WOtrwSimzF7rY
      - key: SUPABASE_STORAGE_BUCKET
        value: content-desk-media
