services:
  - type: web
    name: content-desk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Supabase "content-desk" project -> Settings -> Database -> Connection string
      - key: DATABASE_URL
        sync: false
      # Replit's own AI Integrations gateway -> point these at your own
      # OpenAI-compatible endpoint/key instead (see README)
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      # Media library uploads: tied to Replit's own storage sidecar as shipped
      # (see README "Known gaps after leaving Replit") -- app boots and the
      # rest of it works fine without these, uploads just won't until that's
      # replaced with a real storage backend.
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false
